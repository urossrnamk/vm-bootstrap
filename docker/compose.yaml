services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"

    networks:
      - proxy


  home:
    build:
      context: ./apps/home

    container_name: home
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.home.rule=Host(`${HOME_DOMAIN}`)"
      - "traefik.http.routers.home.entrypoints=websecure"

      - "traefik.http.routers.home.tls=true"
      - "traefik.http.routers.home.tls.certresolver=letsencrypt"

      - "traefik.http.services.home.loadbalancer.server.port=80"

    networks:
      - proxy


  demo:
    build:
      context: ./apps/demo

    container_name: demo
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo.rule=Host(`demo.${HOME_DOMAIN}`)"
      - "traefik.http.routers.demo.entrypoints=websecure"

      - "traefik.http.routers.demo.tls=true"
      - "traefik.http.routers.demo.tls.certresolver=letsencrypt"

      - "traefik.http.services.demo.loadbalancer.server.port=80"

    networks:
      - proxy

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped

    environment:
      DOZZLE_AUTH_PROVIDER: simple

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${HOME_DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

    networks:
      - proxy


networks:
  proxy:
    name: proxy

volumes:
  letsencrypt:    